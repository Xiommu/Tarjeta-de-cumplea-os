<!-- REEMPLAZA SOLO LA SECCIÓN START SCREEN POR ESTA -->

<div id="startScreen" class="overlay start-bg">

  <!-- NUBES -->

  <div class="pixel-cloud cloud1"></div>
  <div class="pixel-cloud cloud2"></div>
  <div class="pixel-cloud cloud3"></div>

  <div class="overlay start-overlay">

    <div class="text-center px-6">

      <h1
        data-template-id="game-title"
        class="game-title text-4xl md:text-6xl mb-4"
      >
        SUPER<br>
        MANUEL BROS
      </h1>

      <p
        data-template-id="game-subtitle"
        class="text-yellow-300 text-sm mb-10 blink"
      >
        © 1985 MANUEL ENTERTAINMENT
      </p>

      <div class="flex flex-col items-center gap-5 mb-10">

        <button
          id="player1Btn"
          class="player-select pixel-btn text-white text-sm selected"
          onclick="selectPlayer(1)"
        >
          ▶ 1 PLAYER GAME
        </button>

        <button
          id="player2Btn"
          class="player-select pixel-btn text-white text-sm"
          onclick="selectPlayer(2)"
        >
          2 PLAYER GAME
        </button>

      </div>

      <button
        id="startBtn"
        data-template-id="start-button"
        class="retro-btn pixel-btn text-lg"
      >
        START
      </button>

      <p
        data-template-id="instructions-text"
        class="text-white text-xs mt-10 leading-relaxed opacity-90"
      >
        TOCA LA PANTALLA<br>
        O PRESIONA ESPACIO
      </p>

    </div>

  </div>

</div>
